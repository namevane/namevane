[[permission]]
identifier = "allow-list-pins"
description = "Read the saved list of custom addresses."
commands.allow = ["list_pins"]

[[permission]]
identifier = "allow-upsert-pin"
description = "Add or update a custom address."
commands.allow = ["upsert_pin"]

[[permission]]
identifier = "allow-delete-pin"
description = "Remove a custom address from the saved list."
commands.allow = ["delete_pin"]

[[permission]]
identifier = "allow-set-pin-enabled"
description = "Turn a saved custom address on or off."
commands.allow = ["set_pin_enabled"]

[[permission]]
identifier = "allow-app-about"
description = "Read the Namevane version and whether a release is available."
commands.allow = ["app_about"]

[[permission]]
identifier = "allow-open-project-page"
description = "Open a Namevane page on GitHub in the browser."
commands.allow = ["open_project_page"]

[[permission]]
identifier = "allow-runtime-settings"
description = "Read whether Namevane stays running and opens at login."
commands.allow = ["runtime_settings"]

[[permission]]
identifier = "allow-set-language"
description = "Choose the language of Namevane."
commands.allow = ["set_language"]

[[permission]]
identifier = "allow-set-run-in-background"
description = "Choose whether closing the window leaves Namevane running."
commands.allow = ["set_run_in_background"]

[[permission]]
identifier = "allow-set-open-at-login"
description = "Choose whether Namevane opens when you log in."
commands.allow = ["set_open_at_login"]

[[permission]]
identifier = "allow-export-pins"
description = "Save the address list to a file."
commands.allow = ["export_pins"]

[[permission]]
identifier = "allow-import-pins"
description = "Add addresses from a saved list."
commands.allow = ["import_pins"]

[[permission]]
identifier = "allow-install-update"
description = "Download a newer Namevane release and replace the installed app."
commands.allow = ["install_update"]
